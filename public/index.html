<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f5bea">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<title>Unified Calendar</title>
</head>
<body>

<div id="loginView" class="login hidden">
  <h1>Unified Calendar</h1>
  <p>Your private, college and work calendars in one place.</p>
  <div id="ssoButtons"></div>
  <form id="devForm" class="hidden"><input id="devEmail" type="email" placeholder="email (local test login)" style="width:100%;margin-top:8px" required><button class="sso" style="margin-top:8px">Continue</button></form>
  <div class="msg" id="loginMsg"></div>
</div>

<div id="appView" class="hidden">
<header>
  <h1>Unified Calendar</h1>
  <button id="prev" aria-label="Previous">‹</button>
  <button id="today">Today</button>
  <button id="next" aria-label="Next">›</button>
  <span class="title" id="title"></span>
  <span class="spacer"></span>
  <span class="seg"><button id="vMonth" class="on">Month</button><button id="vAgenda">Agenda</button></span>
  <button id="refresh" title="Fetch the latest from all calendars">↻</button>
  <span class="menu"><button id="acctBtn" aria-label="Account">👤</button><div class="pop hidden" id="acctPop"></div></span>
</header>

<main>
  <aside>
    <div id="cals"></div>
    <div class="actions" style="justify-content:flex-start"><button class="primary" id="add">+ Add calendar link</button></div>
  </aside>
  <section class="view" id="view"></section>
</main>
</div>

<dialog id="addDlg">
  <form method="dialog" id="addForm">
    <h3 style="margin:0 0 4px">Add a calendar link</h3>
    <label>Name</label><input id="fName" placeholder="e.g. College timetable" required>
    <label>Type</label>
    <select id="fGroup"><option value="private">Private</option><option value="college" selected>College</option><option value="work">Work</option></select>
    <label>Private calendar link (.ics)</label><input id="fUrl" placeholder="https://… or webcal://…" required>
    <details class="help"><summary>Where do I find this link?</summary>
      <p>Look for “Subscribe”, “Export” or “iCal / webcal link” in your college timetable or learning platform. Treat the link like a password.</p>
    </details>
    <div class="err" id="fErr"></div>
    <div class="actions"><button type="button" id="fCancel">Cancel</button><button class="primary" id="fSave" value="save">Add</button></div>
  </form>
</dialog>

<dialog id="editDlg">
  <form method="dialog" id="editForm">
    <h3 style="margin:0 0 4px">Edit calendar</h3>
    <label>Name</label><input id="eName" required>
    <label>Type</label><select id="eGroup"><option value="private">Private</option><option value="college">College</option><option value="work">Work</option></select>
    <label>Colour</label><input id="eColor" type="color" style="height:38px;padding:2px">
    <div class="actions"><button type="button" id="eCancel">Cancel</button><button class="primary" value="save">Save</button></div>
  </form>
</dialog>

<dialog id="evDlg"><div id="evBody"></div><div class="actions"><button id="evClose">Close</button></div></dialog>

<script src="/app.js"></script>
</body>
</html>
